# Scraper configuration

# Input
seed_urls_file: "data/seed_urls.txt"

# Output directory for individual JSON documents
output_dir: "output"

# Log file
log_file: "output/scraper.log"

# User-Agent information
user_agent: "KevinKiruiPoliteScraper/1.0"

# Public contact URL for responsible scraping
contact_url: "https://github.com/arapkirui513-hub/polite-scraper"

# Minimum delay (seconds) between requests when robots.txt
# does not specify Crawl-delay.
min_delay_seconds: 2.0

# HTTP settings
timeout_seconds: 10
max_retries: 3